<!DOCTYPE html>
<html lang="en" class="scroll-smooth bg-brand-black text-white antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-weight='900' fill='white'>F</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <title>FLEX | Engineered Performance & Streetwear Apparel</title>
    <meta name="description" content="FLEX is a luxury performance gym-wear and streetwear brand. Engineered compression tees, oversized muscle shirts, joggers, and tanks built for movement, discipline, and modern aesthetics." />
    <meta name="keywords" content="FLEX, gym wear, compression shirts, muscle tees, oversized tees, streetwear, gym joggers, athletic apparel" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Open Graph -->
    <meta property="og:title" content="FLEX | Built Different. Flex It." />
    <meta property="og:description" content="Engineered performance essentials and luxury athletic streetwear. Heavyweight 240+ GSM cottons, zoned medical-grade compression, and unrestricted athletic drape." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://flex-fit.shop/" />
    <meta property="og:image" content="/assets/branding/homepage-mockup.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FLEX | Luxury Performance & Streetwear Apparel" />
    <meta name="twitter:description" content="Heavyweight 240+ GSM cottons, zoned medical-grade compression, and unrestricted athletic drape." />
    <meta name="twitter:image" content="/assets/branding/homepage-mockup.jpg" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ClothingStore",
      "name": "FLEX",
      "url": "https://flex-fit.shop/",
      "logo": "https://flex-fit.shop/assets/branding/brand-kit.jpg",
      "image": "https://flex-fit.shop/assets/branding/homepage-mockup.jpg",
      "description": "FLEX is a luxury athletic performance and streetwear apparel brand. Engineered compression shirts, oversized muscle tees, and French terry joggers.",
      "priceRange": "₹999 - ₹2499",
      "currenciesAccepted": "INR, USD",
      "paymentAccepted": "Cash, Credit Card, UPI, Net Banking",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "FLEX Drop 01 Catalog",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Product",
              "name": "FLEX Oversized Muscle Tee",
              "category": "Muscle Tee",
              "offers": {
                "@type": "Offer",
                "price": "1199",
                "priceCurrency": "INR",
                "availability": "https://schema.org/InStock"
              }
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Product",
              "name": "FLEX Pro Seamless Compression Tee",
              "category": "Compression Wear",
              "offers": {
                "@type": "Offer",
                "price": "1299",
                "priceCurrency": "INR",
                "availability": "https://schema.org/InStock"
              }
            }
          }
        ]
      }
    }
    </script>

    <!-- Fonts: Syne (Headings) + Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-brand-black text-brand-light min-h-screen selection:bg-brand-beige selection:text-black">
    <div id="root"></div>

</html>
