    <!-- Open Graph -->
    <meta property="og:title" content="FLEX | Built Different. Flex It." />

          "@id": "https://www.flex-fit.shop/#store",
          "name": "FLEX",
          "legalName": "FLEX Apparel Co.",
          "url": "https://www.flex-fit.shop/",
          "logo": "https://www.flex-fit.shop/assets/branding/brand-kit.webp",

          "description": "FLEX is an Indian luxury athletic performance and modern streetwear brand. Engineered compression shirts, 240+ GSM oversized muscle tees, and French terry joggers.",

          "currenciesAccepted": "INR, USD",
          "paymentAccepted": "UPI, Cash on Delivery, Credit Card, Debit Card, Net Banking",
          "areaServed": {
            "@type": "Country",
            "name": "India"
          },
          "contactPoint": {
            "@type": "ContactPoint",

            "https://instagram.com/flex_apparel_official",

          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://www.flex-fit.shop/#website",

          "name": "FLEX Apparel",

            "query-input": "required name=search_term_string"
          }
        }
      ]

    <!-- Preload LCP Hero Image for Instant Mobile Paint -->
